[project]
name = "remote-mcp-demo"
version = "0.1.0"
description = "Shared machine and workspace tool environment for agents"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.5,<5",
    "jsonschema>=4.20,<5",
    "mcp==1.26.0",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
